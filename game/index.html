<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayang Senja — Misi Senyap</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 1280px;
            height: 800px;
            margin: 0 auto;
            background: #111;
        }
        canvas {
            display: block;
            width: 1280px;
            height: 800px;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .hud-top {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-bottom {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .detection-container {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            position: relative;
        }
        #detection-bar {
            width: 0%;
            height: 100%;
            background: #f00;
            transition: width 0.1s;
        }
        .stat-group {
            display: flex;
            gap: 20px;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            display: none;
            text-align: center;
        }
        .toast {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1280" height="800"></canvas>
        <div id="hud">
            <div class="hud-top">
                <div class="stat-group">
                    <div class="stat" id="level-name">Galeri Senja</div>
                    <div class="stat" id="artifacts-count">Artefak 0/3</div>
                </div>
                <div class="stat-group">
                    <div class="stat">
                        <span>Terdeteksi</span>
                        <div class="detection-container"><div id="detection-bar"></div></div>
                    </div>
                </div>
                <div class="stat-group">
                    <div class="stat" id="lives">❤️❤️❤️</div>
                    <div class="stat" id="timer">00:00</div>
                    <div class="stat" id="score">0</div>
                </div>
            </div>
            <div class="hud-bottom">
                <div>WASD: Gerak | Shift: Senyap | Klik: Lempar Kerikil (Sisa: 3)</div>
                <div>P/Esc: Jeda | R: Ulang | M: Bisukan</div>
            </div>
        </div>
        <div id="warning" class="warning">HAMPIR KETAHUAN!</div>
        <div id="toast" class="toast">Lolos...</div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
